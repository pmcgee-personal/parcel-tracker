# .github/workflows/deploy.yml
name: Deploy Parcel Tracker

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22" # Match the Lambda runtime (nodejs22.x)
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Cache SAM build artifacts
        uses: actions/cache@v4
        with:
          path: .aws-sam/build
          key: ${{ runner.os }}-sam-${{ hashFiles('template.yaml') }}
          restore-keys: |
            ${{ runner.os }}-sam-

      - name: Run backend tests
        run: node --test # Gate the deploy on the src/lib unit tests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2 # Make sure this is your correct AWS region

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --use-container

      - name: SAM Deploy
        # MODIFIED LINE: Added --parameter-overrides to inject the NTFY_URL secret securely
        run: >
          sam deploy 
          --no-confirm-changeset 
          --stack-name parcel-tracker-stack 
          --no-fail-on-empty-changeset 
          --parameter-overrides NtfyUrl="${{ secrets.NTFY_URL }}"

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

      - name: Build and Deploy Frontend
        working-directory: ./frontend
        run: |
          # 1. Fetch the dynamic URLs/IDs from the deployed SAM stack
          API_URL=$(aws cloudformation describe-stacks --stack-name parcel-tracker-stack --query "Stacks[0].Outputs[?OutputKey=='ListApiUrl'].OutputValue" --output text)
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name parcel-tracker-stack --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name parcel-tracker-stack --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)

          # Fetch the generated API key value required by the /track endpoints.
          # The output gives the key ID; --include-value resolves it to the secret.
          API_KEY_ID=$(aws cloudformation describe-stacks --stack-name parcel-tracker-stack --query "Stacks[0].Outputs[?OutputKey=='ApiKeyId'].OutputValue" --output text)
          API_KEY=$(aws apigateway get-api-key --api-key "$API_KEY_ID" --include-value --query value --output text)

          # Mask the API key in GitHub Actions logs
          echo "::add-mask::$API_KEY"

          # 2. Build React (dependencies already installed by lint step)
          VITE_API_BASE_URL=$API_URL VITE_API_KEY=$API_KEY npm run build

          # 3. Sync the built website to S3 and invalidate the CloudFront cache
          aws s3 sync dist/ s3://$BUCKET_NAME --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

      - name: Smoke Test Deployment
        run: |
          # Get CloudFront URL from stack outputs
          CF_URL=$(aws cloudformation describe-stacks --stack-name parcel-tracker-stack --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomainName'].OutputValue" --output text)

          # Get API URL from stack outputs
          API_URL=$(aws cloudformation describe-stacks --stack-name parcel-tracker-stack --query "Stacks[0].Outputs[?OutputKey=='ListApiUrl'].OutputValue" --output text)

          # Fetch API key
          API_KEY_ID=$(aws cloudformation describe-stacks --stack-name parcel-tracker-stack --query "Stacks[0].Outputs[?OutputKey=='ApiKeyId'].OutputValue" --output text)
          API_KEY=$(aws apigateway get-api-key --api-key "$API_KEY_ID" --include-value --query value --output text)

          echo "Testing frontend at $CF_URL"
          echo "Testing API at $API_URL"
          if [ -z "$API_KEY" ]; then
            echo "❌ Failed to retrieve API key"
            exit 1
          fi

          # Test 1: Frontend loads (expect 200)
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CF_URL/")
          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "❌ Frontend health check failed: HTTP $FRONTEND_STATUS"
            exit 1
          fi
          echo "✅ Frontend is responding"

          # Test 2: API responds with API key (expect 200)
          API_RESPONSE=$(curl -s -w "\n%{http_code}" "$API_URL/track" -H "x-api-key: $API_KEY")
          API_STATUS=$(echo "$API_RESPONSE" | tail -n 1)
          API_BODY=$(echo "$API_RESPONSE" | head -n -1)

          if [ "$API_STATUS" != "200" ]; then
            echo "❌ API health check failed: HTTP $API_STATUS"
            echo "Response body: $API_BODY"
            exit 1
          fi
          echo "✅ API is responding"

          echo "✅ Deployment smoke tests passed"
