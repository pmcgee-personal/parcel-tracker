AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  parcel-tracker
  A personal package tracking dashboard for inbound and outbound shipments.

# -----------------------------------------------------------------------------
# PARAMETERS
# -----------------------------------------------------------------------------
Parameters:
  NtfyUrl:
    Type: String
    Description: "The unique ntfy.sh channel URL used for sending push notifications"
    NoEcho: true # Hides the value in CloudFormation logs and the AWS Console
  AlertEmail:
    Type: String
    Description: "Email address that receives CloudWatch alarm notifications"
    NoEcho: true

Globals:
  Function:
    Timeout: 20 # 20 seconds to allow time for external API calls and database operations
    Runtime: nodejs22.x
  Api:
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
    # Create an API key + usage plan for this API. The key is required only on
    # the browser-facing /track methods (see their per-event Auth). The webhook
    # stays key-free because it is authenticated by RSA signature instead.
    # The throttle/quota cap abuse of the (paid) ShipEngine-backed POST /track.
    Auth:
      UsagePlan:
        CreateUsagePlan: PER_API
        Description: "Throttle and quota limit for the parcel-tracker API"
        Throttle:
          BurstLimit: 10
          RateLimit: 5 # requests per second, steady-state
        Quota:
          Limit: 1000
          Period: DAY

Resources:
  # DynamoDB table to store high-level shipment details.
  # PK = trackingNumber
  ShipmentsTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Shipments
      PrimaryKey:
        Name: trackingNumber
        Type: String
      # Omitting ProvisionedThroughput makes the SimpleTable on-demand
      # (PAY_PER_REQUEST) — self-scaling and avoids scan throttling.
      SSESpecification:
        SSEEnabled: true

  # DynamoDB table to store the timeline of tracking events for each shipment.
  # PK = trackingNumber, SK = occurredAt
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: Events
      AttributeDefinitions:
        - AttributeName: trackingNumber
          AttributeType: S
        - AttributeName: occurredAt
          AttributeType: S
      KeySchema:
        - AttributeName: trackingNumber
          KeyType: HASH
        - AttributeName: occurredAt
          KeyType: RANGE
      # On-demand billing — self-scaling, avoids scan throttling as Events grows.
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  # Lambda function to ingest webhook tracking updates from carrier integrations
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/webhook/index.handler
      Environment:
        Variables:
          SHIPMENTS_TABLE: !Ref ShipmentsTable
          EVENTS_TABLE: !Ref EventsTable
          NTFY_URL: !Ref NtfyUrl # <--- INJECTING PARAMETER HERE SECURELY
          APP_TIMEZONE: America/Los_Angeles # Calendar-day basis for notification dedup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ShipmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        WebhookApi:
          Type: Api
          Properties:
            Path: /webhook
            Method: post

  # Lambda function to register a new tracking number and fetch initial status
  TrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/track/index.handler
      Environment:
        Variables:
          SHIPMENTS_TABLE: !Ref ShipmentsTable
          EVENTS_TABLE: !Ref EventsTable
          # Point the Lambda to the exact secret hierarchy we created
          SECRET_NAME: "ParcelTracker/ShipStationApiKey"
      Policies:
        # Permission to write to both DynamoDB tables
        - DynamoDBCrudPolicy:
            TableName: !Ref ShipmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        # Official AWS SAM policy template name to read a secret
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ParcelTracker/ShipStationApiKey-*"
      Events:
        TrackApi:
          Type: Api
          Properties:
            Path: /track
            Method: post
            Auth:
              ApiKeyRequired: true

  # Lambda function to retrieve all tracked shipments for the frontend
  ListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/list/index.handler
      Environment:
        Variables:
          SHIPMENTS_TABLE: !Ref ShipmentsTable
          # --- NEW: Added Events Table Environment Variable ---
          EVENTS_TABLE: !Ref EventsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ShipmentsTable
        # --- NEW: Added Read Permissions for the Events Table ---
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        ListApi:
          Type: Api
          Properties:
            Path: /track
            Method: get
            Auth:
              ApiKeyRequired: true

  # Lambda function to delete tracked shipments and stop tracking webhooks
  DeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/delete/index.handler
      Environment:
        Variables:
          SHIPMENTS_TABLE: !Ref ShipmentsTable
          EVENTS_TABLE: !Ref EventsTable
          SECRET_NAME: "ParcelTracker/ShipStationApiKey"
          NTFY_URL: !Ref NtfyUrl
      Policies:
        # Permission to read and delete from both DynamoDB tables
        - DynamoDBCrudPolicy:
            TableName: !Ref ShipmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        # Permission to read API key from Secrets Manager
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ParcelTracker/ShipStationApiKey-*"
      Events:
        DeleteApi:
          Type: Api
          Properties:
            Path: /track/{trackingNumber}
            Method: delete
            Auth:
              ApiKeyRequired: true

  # Lambda function to monitor for stale shipments (no updates in 48+ hours)
  MonitorStalenessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/monitor-staleness/index.handler
      Runtime: nodejs22.x
      Timeout: 60
      Environment:
        Variables:
          SHIPMENTS_TABLE: !Ref ShipmentsTable
          NTFY_URL: !Ref NtfyUrl
      Policies:
        # Permission to scan and update Shipments table
        - DynamoDBCrudPolicy:
            TableName: !Ref ShipmentsTable
      Events:
        StalnessCheck:
          Type: Schedule
          Properties:
            Schedule: "cron(0 */6 * * ? *)" # Every 6 hours
            Name: ParcelTrackerStalenessMonitor
            Description: Monitor for shipments with no updates in 48+ hours

  # --- MONITORING: ALERTS + ALARMS ---
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: parcel-tracker-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  WebhookLoggedErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WebhookFunction}"
      FilterPattern: '"ERROR"' # console.error lines (caught failures that never raise a Lambda Error)
      MetricTransformations:
        - MetricNamespace: ParcelTracker
          MetricName: WebhookLoggedErrors
          MetricValue: "1"
          DefaultValue: 0

  TrackLoggedErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TrackFunction}"
      FilterPattern: '"ERROR"' # console.error lines (caught failures that never raise a Lambda Error)
      MetricTransformations:
        - MetricNamespace: ParcelTracker
          MetricName: TrackLoggedErrors
          MetricValue: "1"
          DefaultValue: 0

  ListLoggedErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ListFunction}"
      FilterPattern: '"ERROR"' # console.error lines (caught failures that never raise a Lambda Error)
      MetricTransformations:
        - MetricNamespace: ParcelTracker
          MetricName: ListLoggedErrors
          MetricValue: "1"
          DefaultValue: 0

  DeleteLoggedErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DeleteFunction}"
      FilterPattern: '"ERROR"' # console.error lines (caught failures that never raise a Lambda Error)
      MetricTransformations:
        - MetricNamespace: ParcelTracker
          MetricName: DeleteLoggedErrors
          MetricValue: "1"
          DefaultValue: 0

  MonitorStalenessLoggedErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MonitorStalenessFunction}"
      FilterPattern: '"ERROR"' # console.error lines (caught failures that never raise a Lambda Error)
      MetricTransformations:
        - MetricNamespace: ParcelTracker
          MetricName: MonitorStalenessLoggedErrors
          MetricValue: "1"
          DefaultValue: 0

  WebhookFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ParcelTracker-Webhook-Failures
      AlarmDescription: "WebhookFunction raised a Lambda error or logged an ERROR"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: total
          Expression: "errs + logged"
          Label: Failures
          ReturnData: true
        - Id: errs
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref WebhookFunction
        - Id: logged
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: ParcelTracker
              MetricName: WebhookLoggedErrors
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  TrackFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ParcelTracker-Track-Failures
      AlarmDescription: "TrackFunction raised a Lambda error or logged an ERROR"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: total
          Expression: "errs + logged"
          Label: Failures
          ReturnData: true
        - Id: errs
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref TrackFunction
        - Id: logged
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: ParcelTracker
              MetricName: TrackLoggedErrors
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ListFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ParcelTracker-List-Failures
      AlarmDescription: "ListFunction raised a Lambda error or logged an ERROR"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: total
          Expression: "errs + logged"
          Label: Failures
          ReturnData: true
        - Id: errs
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ListFunction
        - Id: logged
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: ParcelTracker
              MetricName: ListLoggedErrors
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DeleteFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ParcelTracker-Delete-Failures
      AlarmDescription: "DeleteFunction raised a Lambda error or logged an ERROR"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: total
          Expression: "errs + logged"
          Label: Failures
          ReturnData: true
        - Id: errs
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref DeleteFunction
        - Id: logged
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: ParcelTracker
              MetricName: DeleteLoggedErrors
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  MonitorStalenessFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ParcelTracker-MonitorStaleness-Failures
      AlarmDescription: "MonitorStalenessFunction raised a Lambda error or logged an ERROR"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: total
          Expression: "errs + logged"
          Label: Failures
          ReturnData: true
        - Id: errs
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref MonitorStalenessFunction
        - Id: logged
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: ParcelTracker
              MetricName: MonitorStalenessLoggedErrors
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ParcelTracker-Api-5XX
      AlarmDescription: "API Gateway returned a 5XX response"
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref AWS::StackName # SAM implicit API is named after the stack
        - Name: Stage
          Value: Prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # The staleness monitor is scheduled every 6h; no invocation in 12h means the schedule is broken.
  StalenessNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ParcelTracker-Staleness-NotRunning
      AlarmDescription: "MonitorStalenessFunction has not been invoked in 12 hours"
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref MonitorStalenessFunction
      Statistic: Sum
      Period: 43200
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # --- FRONTEND HOSTING RESOURCES ---
  FrontendBucket:
    Type: AWS::S3::Bucket
    Metadata:
      # Suppress cfn-guard rules that interfere with public static website hosting
      guard:
        SuppressedRules:
          - S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED
          - S3_BUCKET_PUBLIC_READ_PROHIBITED
          - S3_BUCKET_PUBLIC_WRITE_PROHIBITED
          - S3_BUCKET_SSL_REQUESTS_ONLY
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      # Fix Error 5: Enable Bucket Versioning
      VersioningConfiguration:
        Status: Enabled
      # Fix Error 4: Enable default Server-Side Encryption
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      # Suppress cfn-guard picky regex matching at the policy level so VS Code stays green
      guard:
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Statement 1: Keep S3 public-readable for CloudFront website hosting
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

  FrontendCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName:
              !Select [2, !Split ["/", !GetAtt FrontendBucket.WebsiteURL]]
            Id: S3Origin
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false

Outputs:
  WebhookApiUrl:
    Description: "API Gateway endpoint URL for the Webhook Ingestion endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook"

  TrackApiUrl:
    Description: "API Gateway endpoint URL for the Track API endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/track"

  ListApiUrl:
    Description: "API Gateway endpoint URL for the List API endpoint (GET)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/track"

  ApiKeyId:
    Description: >
      ID of the API key required by the /track endpoints. Retrieve the secret
      value with:
      aws apigateway get-api-key --api-key <this-id> --include-value --query value --output text
    Value: !Ref ServerlessRestApiApiKey

  # --- FRONTEND OUTPUTS ---
  FrontendBucketName:
    Description: "Name of the S3 bucket hosting the frontend"
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Description: "ID of the CloudFront distribution"
    Value: !Ref FrontendCloudFront

  CloudFrontDomainName:
    Description: "Public URL of your React dashboard"
    Value: !Sub "https://${FrontendCloudFront.DomainName}"
